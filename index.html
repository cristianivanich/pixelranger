
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelRanger - Play on X</title>

    <!-- METADATOS ESTÁNDAR (OPEN GRAPH) - X los necesita como respaldo -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="PixelRanger">
    <meta property="og:description" content="¡Juega a PixelRanger directamente desde tu timeline!">
    <meta property="og:url" content="https://cristianivanich.github.io/pixelranger/">
    <meta property="og:image" content="https://cristianivanich.github.io/pixelranger/preview.png">

    <!-- CONFIGURACIÓN DE TWITTER / X CARDS -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@de_carazaa"> <!-- Poné tu @ de Twitter -->
    <meta name="twitter:title" content="PixelRanger">
    <meta name="twitter:description" content="¡Juega a PixelRanger directamente desde tu timeline de X/Twitter!">
    
    <!-- Dirección exacta del juego (HTTPS obligatorio) -->
    <meta name="twitter:player" content="https://cristianivanich.github.io/pixelranger/">
    <meta name="twitter:player:width" content="600">
    <meta name="twitter:player:height" content="450">
    
    <!-- Dirección exacta de la imagen (HTTPS obligatorio) -->
    <meta name="twitter:image" content="https://cristianivanich.github.io/pixelranger/preview.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #player {
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 450px;
        }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="player"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player");
            container.appendChild(player);
            player.load("juego.swf"); 
        });
    </script>

</body>
</html>
