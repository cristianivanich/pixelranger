<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelRanger - Play on X</title>

    <!-- TWITTER CARDS (PLAYER CARD) CONFIGURATION -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@TuUsuarioDeTwitter"> <!-- Cambia esto -->
    <meta name="twitter:title" content="PixelRanger">
    <meta name="twitter:description" content="¡Juega a PixelRanger directamente desde tu timeline de X/Twitter!">
    <!-- URL del archivo index.html en tu GitHub Pages -->
    <meta name="twitter:player" content="https://TU_USUARIO.github.io/pixelranger/">
    <!-- Dimensiones del reproductor en el tuit -->
    <meta name="twitter:player:width" content="600">
    <meta name="twitter:player:height" content="450">
    <!-- Imagen de portada que se ve antes de darle "Play" en el tuit -->
    <meta name="twitter:image" content="https://TU_USUARIO.github.io/pixelranger/preview.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #player {
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 450px;
        }
    </style>
    <!-- Cargamos Ruffle directamente desde su CDN oficial -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="player"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player");
            container.appendChild(player);
            
            // Reemplaza "juego.swf" por el nombre exacto de tu archivo Flash
            player.load("juego.swf"); 
        });
    </script>

</body>
</html>
